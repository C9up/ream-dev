# What `cargo deny` refuses, and the two things it is told to tolerate.
#
# Nothing ran this before: `pnpm quality:packages` tested the ROOT cargo
# workspace only, which is two crates, and never looked at an advisory. Five
# packages were failing strict clippy at the same time and nothing said so.
#
# Run it with `pnpm quality:rust`, which walks every package workspace.

[advisories]
yanked = "deny"
# READ THIS BEFORE DELETING AN ENTRY BELOW.
#
# One file, sixteen workspaces. `pnpm quality:rust` runs this against every
# package's own Cargo workspace, so an exception that one package needs is
# reported as `advisory-not-detected` by the other fifteen. That warning means
# "this advisory did not come up HERE", not "this exception is dead", and
# reading it the other way has already been done once.
#
# To decide whether an entry can go: remove it, run `pnpm quality:rust`, and
# see whether any workspace turns red. Both entries below were checked that
# way — rsa fails the root, atlas and vellum; paste fails ream-mcp.
ignore = [
  # RUSTSEC-2023-0071 — Marvin, a timing sidechannel in `rsa`'s private-key
  # operation. TWO packages reach it, and only one of them for the reason this
  # exception used to give.
  #
  # atlas, through `sqlx-mysql`, which uses it ONLY to encrypt the password
  # during MySQL's `caching_sha2_password` handshake — a public-key operation,
  # on data the attacker supplied in the first place.
  #
  # vellum, which signs PDFs: `cms.rs` loads an `RsaPrivateKey` and runs the
  # private-key operation the advisory is actually about, on a digest a caller
  # can influence and repeat. That is NOT covered by the sentence above, and
  # writing it as if it were is how it stopped being looked at.
  #
  # vellum's signer BLINDS — it hands `rsa` a generator through
  # `RandomizedSigner`, which is what the advisory's own mitigation amounts to
  # while no fixed release exists. That REDUCES the exposure; it does not close
  # it. `rsa` remains an affected version, the advisory recognises no fixed
  # one, and RustCrypto/RSA#626 still tracks side channels in the padding
  # modes. What is accepted here is a residual risk, not a resolved finding.
  #
  # Where that residual risk stops being acceptable: a signer reachable from
  # remote input — an HTTP signing endpoint, a queue a client can feed — puts
  # the timing of a private-key operation under an attacker's control and
  # repetition. That deployment wants an HSM, a remote signing service or an
  # audited constant-time backend, not this exception.
  #
  # Still live on rsa 0.10.0-rc.18, which is what sqlx-mysql 0.9 resolves to:
  # the advisory says "No safe upgrade is available" because the constant-time
  # rewrite has not shipped in any release. Reaching 0.10 did not close it.
  { id = "RUSTSEC-2023-0071", reason = "atlas: public-key handshake only. vellum: a private-key operation, blinded in cms.rs — residual risk accepted, NOT closed; a remotely-reachable signer wants an HSM. No fixed release in any line" },
  # RUSTSEC-2024-0436 — `paste` is unmaintained. A proc-macro that pastes
  # identifiers together at compile time: it ships no runtime code, so an
  # unmaintained release is a maintenance risk rather than an exposure. It comes
  # in transitively and cannot be dropped without dropping its parent.
  # Reached only by ream-mcp, through the ONNX runtime's dependency tree.
  { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time proc-macro with no runtime surface; transitive and unmaintained upstream" },
  # RUSTSEC-2026-0206 / RUSTSEC-2026-0192 — `rustybuzz` and `ttf-parser` are
  # unmaintained. Both reach vellum through krilla, which is what draws the
  # PDF; krilla 0.8.2 is the latest release and has not moved to the named
  # replacements (`harfrust`, `skrifa`) yet.
  #
  # These are the only two entries here on code that parses UNTRUSTED input:
  # an application embedding a font it did not author hands these crates bytes
  # from outside. That is the exposure, and it is accepted knowingly rather
  # than dismissed — both advisories say "No safe upgrade is available", so
  # there is no version to move to and no configuration that avoids them short
  # of dropping PDF output entirely.
  #
  # REVISIT ON EVERY krilla BUMP: the day it ships against harfrust/skrifa,
  # both of these come out. Nothing else in the tree pulls them.
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz via krilla: unmaintained with no fixed release; revisit when krilla moves to harfrust" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via krilla/rustybuzz: unmaintained with no fixed release; revisit when krilla moves to skrifa" },
]

[bans]
multiple-versions = "allow"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
