# What `cargo audit` is allowed to pass over, and why.
#
# An entry here is a claim that the advisory does not reach this codebase, and
# it has to be checkable. Anything not listed fails the gate.

[advisories]
ignore = [
  # RUSTSEC-2023-0071 — Marvin Attack on `rsa`, a timing sidechannel in the
  # private-key operation. No fixed version exists upstream, in any line.
  #
  # TWO packages reach it, and they are not in the same position. Naming only
  # the first is how this stopped being looked at, so both are written down.
  #
  # atlas, through atlas-db → sqlx → sqlx-mysql → rsa, where the crate is used
  # in one direction only: encrypting the password with the MySQL server's
  # PUBLIC key during the caching_sha2_password handshake
  # (sqlx-mysql/src/connection/auth.rs, `rsa_backend::encrypt`). The private key
  # and the decryption both live in the server; the vulnerable operation is
  # never performed there.
  #
  # The dependency is not removable without cost: `mysql-rsa` is what lets a
  # MySQL 8 connection authenticate at all when it is not already TLS, which is
  # why atlas-db/Cargo.toml enables it deliberately. Drop that feature and every
  # non-TLS MySQL 8 connection fails at the handshake.
  #
  # vellum, which SIGNS: `cms.rs` loads an `RsaPrivateKey` and performs exactly
  # the operation the advisory describes, on a digest a caller can influence
  # and repeat. It blinds — the mitigation the advisory itself points to — but
  # blinding reduces the exposure rather than closing it, and RustCrypto/RSA#626
  # still tracks side channels in the padding modes. What is accepted here is a
  # residual risk on a signer used with a key you hold; a signer reachable from
  # remote input wants an HSM or an audited constant-time backend instead. See
  # packages/vellum/README.md, "Where this signer's limits are".
  #
  # Revisit if sqlx ever decrypts with `rsa`, or if a fixed release appears.
  "RUSTSEC-2023-0071",
]
