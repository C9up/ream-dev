packages:
  - "packages/*"
  - "apps/*"

# A dependency on another package of this workspace resolves to the checkout,
# not to the published tarball, so a change is visible to its consumers before
# it is released.
linkWorkspacePackages: true

# pnpm reads `overrides` and the install-script decisions here, not from
# package.json.
overrides:
  # Security advisories on transitive dependencies. Each one is the lowest
  # version the advisory says is patched — pinned here because nothing in the
  # workspace declares them directly, so there is no package.json to bump.
  fast-uri: "^3.1.4"
  hono: "^4.12.25"
  axios: "^1.18.0"
  brace-expansion: "^5.0.8"
  ip-address: "^10.2.2"
  postcss: "^8.5.23"
  nanoid: "^3.3.18"
  uuid: "^11.1.1"
  qs: "^6.15.2"
  esbuild: "^0.28.1"
  body-parser: "^2.3.0"
  "@hono/node-server": "^1.19.15"
  vite: "^7.3.5"
  # One vitest for the whole workspace. Two packages pinned 4.1.9 while the
  # rest asked for ^4.1.2, so both landed in the store and a package could end
  # up running one version against the other's coverage provider — a mix
  # vitest refuses to support.
  vitest: "4.1.11"
  "@vitest/coverage-v8": "4.1.11"
  # Advisory pins, all dev-only. @vitest/browser <4.1.10 lets a Browser Mode
  # provider command bypass the file-access control (GHSA-p63j-vcc4-9vmv);
  # undici <7.29.0 has the TLS-validation bypass and the cross-origin routing
  # pair; vite <7.3.5 the server.fs.deny bypass. jsdom asks for undici ^7, so
  # the pin stays inside 7 rather than forcing 8 on it.
  "@vitest/browser": "4.1.11"
  "@vitest/browser-playwright": "4.1.11"
  undici: "^7.29.0"
  # Two high advisories, both dev-only and transitive: unbounded memory growth
  # with no cache bound (GHSA-c83g-rgw3-j3cx) and a crash / prototype write
  # (GHSA-73wf-gq98-2v4g).
  browserslist: "^4.28.7"

# Which dependencies may run install scripts. The native ones have to build or
# they load nothing at runtime; es5-ext only prints a donation notice.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  utf-8-validate: true
  es5-ext: false
