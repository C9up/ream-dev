packages:
  - "packages/*"
  - "apps/*"

# A dependency on another package of this workspace resolves to the checkout,
# not to the published tarball, so a change is visible to its consumers before
# it is released.
linkWorkspacePackages: true

# No `overrides`. Each package's CI installs it alone, from npm, where the
# workspace's overrides never apply: an override here only made this lockfile
# look patched while the CI installs went on resolving what the ranges allow.
# A fix belongs in the package's own ranges, and every CI run audits what it
# installed (`npm-audit.mjs --installed`). Removed 2026-11-22 with the vitest
# toolchain pinned to 4.1.12 in every manifest.

# Which dependencies may run install scripts. The native ones have to build or
# they load nothing at runtime.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  utf-8-validate: true

# How long a published version waits before this workspace installs it, in
# minutes: one week. A malicious release is usually caught and pulled within
# days, and every advisory floor above is older than that. Stated rather than
# left to the pnpm 11+ default (one day): pnpm 10 had no default at all, and an
# exclusion list under a key nobody set reads as a gate that is not there.
minimumReleaseAge: 10080

# Our own packages: released by this workspace's maintainer from CI, with
# provenance, and consumed the day they go out.
minimumReleaseAgeExclude:
  - '@c9up/*'
  # A security fix younger than the release age, one exact version: ts-morph
  # 28 asks for @ts-morph/common ~0.29.0, and 0.29.0 holds minimatch ^10, with
  # GHSA-g3hv-75wg-m249 and no fixed 10.x; 0.29.1 (2026-11-16) moves to
  # minimatch ^11. Inert from 2026-11-23, when 0.29.1 is a week old: remove it then.
  - '@ts-morph/common@0.29.1'
